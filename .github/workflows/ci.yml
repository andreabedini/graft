name: CI

# build compiles the project once per target and GHC and runs its test
# suites; sdist makes the source distribution of every package in
# cabal.project; docs makes the Haddock documentation for Hackage and for
# GitHub Pages; dist checks the versions of the source distributions and the
# documentation tarballs, and uploads them with SHA256SUMS as one artifact;
# commits checks the commit messages of a PR; ci-ok is the one check that
# the ruleset requires; release publishes dist when the head of main is a
# release commit, made by `mise run release-pr`; pages then publishes the
# documentation to GitHub Pages. The project publishes no executables.
# checks and oldest are graft's own: the doctests, -Werror, the benchmarks
# and the README program on one platform, and the test suites against the
# oldest dependencies that the bounds allow.
#
# A manual run (Actions > CI > Run workflow, or `gh workflow run ci.yml
# --ref BRANCH`) makes every artifact of a release, in dist, without
# releasing: release runs only on a push to main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CABAL_VERSION: 3.18.1.0
  # The documentation comes from this GHC, normally the newest of
  # matrix.ghc. cabal sdist uses none, but haskell-actions/setup installs it.
  RELEASE_GHC: 9.14.1

jobs:
  build:
    name: Build ${{ matrix.target }}, GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.build-runner }}

    strategy:
      fail-fast: false
      matrix:
        # tested-with in graft.cabal.
        ghc:
          - 9.8.4
          - 9.10.3
          - 9.12.2
          - 9.14.1
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
        include:
          - target: x86_64-linux
            build-runner: ubuntu-latest
          - target: aarch64-linux
            build-runner: ubuntu-24.04-arm
          - target: x86_64-macos
            build-runner: macos-15-intel
          - target: aarch64-macos
            build-runner: macos-latest
          - target: x86_64-windows
            build-runner: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Plan
        run: cabal build all --enable-tests --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-

      - name: Build dependencies
        run: cabal build all --enable-tests --only-dependencies -j

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all --enable-tests -j

      # "No tests to run" when the project has no test suites.
      - name: Test
        run: cabal test all --test-show-details=direct

  # The source distributions of every package in cabal.project, as cabal
  # sdist makes them: only the files that the .cabal files list, unlike a
  # checkout of the repository. cabal sdist needs no GHC and its tarballs
  # are reproducible.
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.RELEASE_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      - name: Make source distributions
        run: cabal sdist all -o sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: sdist/*.tar.gz
          if-no-files-found: error

  # The documentation of every package with a library, built with
  # RELEASE_GHC: a tarball for Hackage (`cabal upload --documentation`),
  # which the release publishes, and the documentation of the whole project
  # from cabal haddock-project, which the pages job publishes. Both link to
  # the documentation of the dependencies on Hackage. A package without a
  # library has no documentation.
  docs:
    name: docs
    runs-on: ubuntu-latest
    # cabal.project makes cabal write a GHC environment file for the
    # doctests. haddock-project's final index step would load it and fail to
    # find the in-place graft package, so GHC ignores environment files here.
    env:
      GHC_ENVIRONMENT: "-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ env.RELEASE_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Plan
        run: cabal build all --dry-run

      # The x86_64-linux build with RELEASE_GHC caches the same dependencies.
      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-x86_64-linux-ghc-${{ env.RELEASE_GHC }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-x86_64-linux-ghc-${{ env.RELEASE_GHC }}-

      - name: Build dependencies
        run: cabal build all --only-dependencies -j

      # graft has a docs/ directory of its own, so the tarballs go elsewhere.
      - name: Documentation for Hackage
        run: |
          cabal haddock all --haddock-for-hackage
          mkdir hackage-docs
          mv dist-newstyle/*-docs.tar.gz hackage-docs/

      - name: Documentation of the project
        run: cabal haddock-project --hackage --output=site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: hackage-docs/*-docs.tar.gz
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Checks that need one platform only: every component built with -Werror,
  # the doctests (which need the GHC environment file that cabal.project
  # makes cabal write), the benchmarks, the package metadata, and that the
  # README shows examples/GettingStarted.hs, which the graft-getting-started
  # suite builds and runs.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ env.RELEASE_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Plan
        run: cabal build all --enable-tests --enable-benchmarks -fdoctest --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-checks-ghc-${{ env.RELEASE_GHC }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-checks-ghc-${{ env.RELEASE_GHC }}-

      - name: Build dependencies
        run: cabal build all --enable-tests --enable-benchmarks -fdoctest --only-dependencies -j

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build with -Werror
        run: cabal build all --enable-tests --enable-benchmarks -fdoctest --ghc-options=-Werror -j

      - name: Doctests
        run: cabal test graft-doctest --enable-tests --enable-benchmarks -fdoctest --test-show-details=direct

      - name: Package metadata
        run: cabal check

      - name: README program matches examples/GettingStarted.hs
        run: awk '/^```haskell/{f=1;next} /^```/{if(f){exit}} f' README.md | diff - examples/GettingStarted.hs

  # The test suites against the oldest versions of the dependencies that the
  # bounds in graft.cabal allow, with the oldest GHC in the matrix.
  oldest:
    name: oldest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: 9.8.4
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Test
        run: cabal test all --enable-tests --prefer-oldest --test-show-details=direct

  # Every commit of a PR must follow Conventional Commits, with a type that a
  # commit parser in cliff.toml knows: the release task reads them to choose
  # the next version and to write CHANGELOG.md. git-cliff checks the PR's
  # commits with cliff.toml, without the filters that drop unconventional and
  # unmatched commits from the changelog, and fails on either kind.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          # The same version as in mise.toml.
          version: v2.14.2
          args: --verbose origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        env:
          GIT_CLIFF__GIT__FILTER_UNCONVENTIONAL: "false"
          GIT_CLIFF__GIT__FILTER_COMMITS: "false"
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
          GIT_CLIFF__GIT__FAIL_ON_UNMATCHED_COMMIT: "true"

  # Everything that a release publishes, checked, in one artifact "dist":
  # the source distributions,
  # the documentation tarballs and SHA256SUMS. It runs on every event: a PR, or a
  # manual run (workflow_dispatch, on any branch), gets the same files as a
  # release, and a version mismatch fails before the release commit lands.
  dist:
    name: dist
    needs: [build, sdist, docs]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Download source distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist

      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: docs

      # Every package has the same version, the version of the release, and
      # so does everything else.
      - name: Check versions
        id: check
        run: |
          shopt -s nullglob
          versions=$(for f in sdist/*.tar.gz; do f=${f##*/}; f=${f%.tar.gz}; echo "${f##*-}"; done | sort -u)
          if [[ $(wc -l <<< "$versions") != 1 ]]; then
            echo "::error::The packages have different versions:" $versions
            exit 1
          fi
          version=$versions
          for f in docs/*; do
            if [[ $f != docs/*-"$version"-docs.tar.gz ]]; then
              echo "::error::$f is not the documentation of version $version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Make checksums
        run: |
          mkdir dist
          mv sdist/*.tar.gz docs/*-docs.tar.gz dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The one check that the ruleset requires: whatever the matrix becomes, it
  # fails if any job it needs failed or was cancelled. Without always(), a
  # failed job would make it skipped, and GitHub treats a skipped required
  # check as passed. commits is skipped on pushes to main, which is fine.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, checks, oldest, sdist, docs, dist, commits]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Publishes the dist artifact as a release when the head of main is a
  # release commit ("chore(release): VERSION"), and never on a PR or a manual
  # run. It is idempotent: a rerun continues a draft, or does nothing if the
  # release is published.
  release:
    name: release
    needs: [ci-ok, dist]
    # The implicit success() would also look at commits, which is skipped on
    # pushes, and so skip this job too. Check ci-ok's result instead.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.dist.outputs.version }}
        run: |
          subject=$(git log -1 --format=%s)
          # A squash merge appends " (#123)" to the subject.
          if [[ $subject != "chore(release): $VERSION" && $subject != "chore(release): $VERSION (#"*")" ]]; then
            echo "::error::The release commit \"$subject\" does not match version $VERSION of the packages"
            exit 1
          fi
          state=$(gh release view "v$VERSION" --json isDraft \
                    --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          echo "v$VERSION: $state"
          {
            echo "tag=v$VERSION"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Download dist
        if: steps.plan.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Release notes
        if: steps.plan.outputs.state != 'published'
        env:
          VERSION: ${{ needs.dist.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Attest build provenance
        if: steps.plan.outputs.state != 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Create the draft release
        if: steps.plan.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file NOTES.md

      - name: Upload and publish
        if: steps.plan.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # The release is a draft here, so --clobber is safe on a rerun.
          gh release upload "$TAG" dist/* --clobber
          # Publishing creates the tag and locks the tag and the assets.
          gh release edit "$TAG" --draft=false --latest

  # Publishes the documentation of the project to GitHub Pages when a release
  # is published, so the site shows the latest release. It deploys the site
  # that the docs job of this run built.
  pages:
    name: pages
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
